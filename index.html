<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Carpool — Ride Board</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

    :root {
      --paper: #FAFAF7;
      --panel: #FFFFFF;
      --ink: #1C1C1E;
      --ink-soft: #55555C;
      --line: #E1DFD8;
      --indigo: #2B3A67;
      --indigo-soft: #EEF0F6;
      --sage: #5F7F63;
      --sage-soft: #EBF1EC;
      --brick: #A6402F;
      --amber-dot: #B8863B;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      margin: 0;
      padding: 0 0 80px;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 24px; }

    .masthead { border-bottom: 1px solid var(--line); padding: 36px 0 20px; margin-bottom: 36px; }
    .masthead-row { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 6px; }
    h1 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 32px; margin: 0; letter-spacing: -0.2px; }
    .driver-link { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; letter-spacing: 0.3px; color: var(--indigo); text-decoration: none; border-bottom: 1px solid var(--indigo); padding-bottom: 2px; white-space: nowrap; }
    .driver-link:hover { color: var(--ink); border-color: var(--ink); }

    .section-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 16px; }
    .section-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); }
    h2 { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 19px; margin: 0; }
    section { margin-bottom: 44px; }

    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 24px 26px; }
    .form-row { display: flex; gap: 18px; flex-wrap: wrap; }
    .field { margin-bottom: 16px; flex: 1; min-width: 180px; }
    .field label { display: block; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 500; }
    .field input { width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 2px; background: var(--paper); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 14px; }
    .field input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 3px rgba(43,58,103,0.1); }

    button { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13.5px; border: none; border-radius: 2px; padding: 11px 20px; cursor: pointer; letter-spacing: 0.1px; }
    .btn-primary { background: var(--indigo); color: #fff; }
    .btn-primary:hover { background: #223057; }
    .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--ink); }
    .btn-outline:hover { border-color: var(--ink); }
    .btn-danger-text { background: transparent; border: none; color: var(--brick); font-weight: 600; padding: 8px 4px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; }
    .btn-danger-text:hover { color: #7d2f22; }

    .join-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .join-row .field { margin-bottom: 0; }
    .code-field input { text-transform: uppercase; font-family: 'IBM Plex Mono', monospace; letter-spacing: 1px; }

    .error-text { color: var(--brick); font-size: 13px; margin-top: 10px; }

    .board { border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--panel); }
    .row { display: flex; flex-direction: column; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: none; }
    .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }

    .route { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 17px; }
    .route .arrow { color: var(--ink-soft); font-weight: 400; margin: 0 6px; }
    .meta-line { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }

    .status-block { text-align: right; flex-shrink: 0; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; letter-spacing: 0.4px; text-transform: uppercase; font-weight: 500; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .dot-forming { background: var(--amber-dot); }
    .dot-pending { background: var(--indigo); }
    .dot-confirmed { background: var(--sage); }
    .dot-inactive { background: #B7B5AC; }
    .status-forming { color: var(--amber-dot); }
    .status-pending { color: var(--indigo); }
    .status-confirmed { color: var(--sage); }
    .status-inactive { color: var(--ink-soft); }

    .code-tag { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
    .countdown { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--amber-dot); margin-top: 10px; }

    .members-block { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
    .members-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
    .member-list { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
    .member-list li { padding: 2px 0; display: flex; justify-content: space-between; max-width: 420px; }
    .member-list li .m-contact { color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
    .host-flag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--indigo); border: 1px solid var(--indigo-soft); background: var(--indigo-soft); padding: 1px 6px; border-radius: 2px; margin-left: 8px; }
    .you-flag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--sage); border: 1px solid #D6E4D8; background: var(--sage-soft); padding: 1px 6px; border-radius: 2px; margin-left: 8px; }

    .driver-block { margin-top: 12px; background: var(--sage-soft); border: 1px solid #D6E4D8; padding: 10px 14px; border-radius: 2px; font-size: 13px; }
    .driver-block strong { color: var(--sage); }

    .row-actions { margin-top: 14px; display: flex; gap: 18px; align-items: center; }
    .empty-state { padding: 40px 22px; text-align: center; color: var(--ink-soft); font-size: 14px; }

    footer { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--line); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--ink-soft); }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="masthead">
      <div class="masthead-row">
        <div>
          <p class="eyebrow">Campus Transport Coordination</p>
          <h1>Ride Board</h1>
        </div>
        <a class="driver-link" href="driver.html">Driver sign-in →</a>
      </div>
    </div>

    <section>
      <div class="section-head">
        <span class="section-num">01</span>
        <h2>Start a ride request</h2>
      </div>
      <div class="panel">
        <form id="createForm">
          <div class="form-row">
            <div class="field">
              <label>Destination</label>
              <input type="text" id="destination" required placeholder="Airport Terminal 1">
            </div>
            <div class="field">
              <label>Departure</label>
              <input type="datetime-local" id="departureTime" required>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label>Seats needed</label>
              <input type="number" id="totalSeats" required min="1" value="3">
            </div>
            <div class="field">
              <label>Cost per seat (₹)</label>
              <input type="number" id="costPerSeat" required value="150">
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label>Your name</label>
              <input type="text" id="hostName" required placeholder="Full name">
            </div>
            <div class="field">
              <label>Your contact</label>
              <input type="text" id="hostContact" required placeholder="+91 98765 43210">
            </div>
          </div>
          <button type="submit" class="btn-primary">Create request</button>
          <div class="error-text" id="createError"></div>
        </form>
      </div>
    </section>

    <section>
      <div class="section-head">
        <span class="section-num">02</span>
        <h2>Join with a code</h2>
      </div>
      <div class="panel">
        <div class="join-row">
          <div class="field code-field" style="max-width:160px;">
            <label>Group code</label>
            <input type="text" id="joinCode" maxlength="6" placeholder="ABC123">
          </div>
          <div class="field" style="max-width:220px;">
            <label>Your name</label>
            <input type="text" id="joinName" placeholder="Full name">
          </div>
          <div class="field" style="max-width:220px;">
            <label>Your contact</label>
            <input type="text" id="joinContact" placeholder="+91 98765 43210">
          </div>
          <button id="joinBtn" class="btn-outline">Join group</button>
        </div>
        <div class="error-text" id="joinError"></div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <span class="section-num">03</span>
        <h2>Active requests</h2>
      </div>
      <div class="board" id="groupsList">
        <div class="empty-state">Loading requests…</div>
      </div>
    </section>

    <footer>Campus Carpool — coordination board for student ride sharing.</footer>
  </div>

  <script>
    const API_URL = 'http://localhost:5001/api';
    let cachedGroups = [];

    // ---------- MEMBER TOKEN STORAGE ----------
    // Each group a student creates or joins gives back a private memberToken.
    // We store these keyed by groupId, so one browser can hold multiple
    // memberships (e.g. host of one ride, joiner of another) at once.
    const TOKENS_KEY = 'carpool_member_tokens';

    function getStoredTokens() {
      return JSON.parse(localStorage.getItem(TOKENS_KEY) || '{}');
    }

    function saveMemberToken(groupId, token) {
      const tokens = getStoredTokens();
      tokens[groupId] = token;
      localStorage.setItem(TOKENS_KEY, JSON.stringify(tokens));
    }

    function getMemberToken(groupId) {
      return getStoredTokens()[groupId] || null;
    }

    function removeMemberToken(groupId) {
      const tokens = getStoredTokens();
      delete tokens[groupId];
      localStorage.setItem(TOKENS_KEY, JSON.stringify(tokens));
    }

    function fmtTime(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function countdownText(deadline) {
      const ms = new Date(deadline).getTime() - Date.now();
      if (ms <= 0) return 'Window closed';
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      return `${m}:${s.toString().padStart(2, '0')} remaining to fill seats`;
    }

    function statusMeta(status) {
      const map = {
        FORMING:        ['dot-forming', 'status-forming', 'Forming'],
        PENDING_DRIVER:  ['dot-pending', 'status-pending', 'Driver requested'],
        CONFIRMED:       ['dot-confirmed', 'status-confirmed', 'Confirmed'],
        EXPIRED:         ['dot-inactive', 'status-inactive', 'Expired'],
        CANCELLED:       ['dot-inactive', 'status-inactive', 'Cancelled']
      };
      return map[status] || ['dot-inactive', 'status-inactive', status];
    }

    function renderGroups() {
      const container = document.getElementById('groupsList');
      if (cachedGroups.length === 0) {
        container.innerHTML = '<div class="empty-state">No active requests. Start one above and share the code with classmates.</div>';
        return;
      }

      container.innerHTML = cachedGroups.map(g => {
        const seatsFilled = g.members.length;
        const [dotCls, textCls, label] = statusMeta(g.status);

        const myToken = getMemberToken(g._id);
        const amMember = !!myToken;

        const membersList = g.members.map(m =>
          `<li><span>${m.name}${m.isHost ? '<span class="host-flag">Host</span>' : ''}</span><span class="m-contact">${m.contact}</span></li>`
        ).join('');

        const driverBlock = g.status === 'CONFIRMED'
          ? `<div class="driver-block"><strong>Driver confirmed —</strong> ${g.driverName}, ${g.driverContact}</div>`
          : '';

        const countdownBlock = g.status === 'FORMING'
          ? `<div class="countdown" data-deadline="${g.formingDeadline}">${countdownText(g.formingDeadline)}</div>`
          : '';

        // Only show action buttons if this browser actually holds a
        // membership token for this specific group. The server is still
        // the real gatekeeper (it validates the token on every request);
        // this just avoids showing buttons that would obviously fail.
        const canAct = ['FORMING', 'PENDING_DRIVER', 'CONFIRMED'].includes(g.status);
        const actions = (canAct && amMember) ? `
          <div class="row-actions">
            <button class="btn-danger-text" onclick="leaveGroup('${g._id}')">Leave group</button>
            <button class="btn-danger-text" onclick="cancelGroup('${g._id}')">Cancel ride (host only)</button>
          </div>` : '';

        return `
          <div class="row" data-id="${g._id}">
            <div class="row-top">
              <div>
                <div class="route">${g.origin}<span class="arrow">→</span>${g.destination}</div>
                <div class="meta-line">${fmtTime(g.departureTime)} · ${seatsFilled}/${g.totalSeats} seats · ₹${g.costPerSeat} per seat</div>
                <div class="code-tag">Code ${g.groupCode}${amMember ? '<span class="you-flag">You\'re in</span>' : ''}</div>
              </div>
              <div class="status-block">
                <span class="status ${textCls}"><span class="dot ${dotCls}"></span>${label}</span>
              </div>
            </div>
            ${countdownBlock}
            <div class="members-block">
              <div class="members-label">Group members</div>
              <ul class="member-list">${membersList}</ul>
            </div>
            ${driverBlock}
            ${actions}
          </div>
        `;
      }).join('');
    }

    async function loadGroups() {
      try {
        const res = await fetch(`${API_URL}/groups`);
        if (!res.ok) throw new Error(`Server responded with ${res.status}`);
        cachedGroups = await res.json();
        renderGroups();
      } catch (err) {
        document.getElementById('groupsList').innerHTML = `<div class="empty-state error-text">Could not reach the server. ${err.message}</div>`;
      }
    }

    setInterval(() => {
      document.querySelectorAll('.countdown').forEach(el => {
        el.textContent = countdownText(el.dataset.deadline);
      });
    }, 1000);

    setInterval(loadGroups, 15000);

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('createError');
      errorEl.textContent = '';

      const payload = {
        destination: document.getElementById('destination').value,
        departureTime: document.getElementById('departureTime').value,
        totalSeats: Number(document.getElementById('totalSeats').value),
        costPerSeat: Number(document.getElementById('costPerSeat').value),
        hostName: document.getElementById('hostName').value,
        hostContact: document.getElementById('hostContact').value
      };

      try {
        const res = await fetch(`${API_URL}/groups`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) { errorEl.textContent = data.error || 'Could not create the request.'; return; }

        saveMemberToken(data.group._id, data.memberToken);

        alert(`Request created. Share this code with classmates: ${data.group.groupCode}`);
        document.getElementById('createForm').reset();
        loadGroups();
      } catch (err) {
        errorEl.textContent = 'Network error: ' + err.message;
      }
    });

    document.getElementById('joinBtn').addEventListener('click', async () => {
      const errorEl = document.getElementById('joinError');
      errorEl.textContent = '';

      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      const name = document.getElementById('joinName').value.trim();
      const contact = document.getElementById('joinContact').value.trim();

      if (!code || !name || !contact) {
        errorEl.textContent = 'Enter the code, your name, and your contact to join.';
        return;
      }

      try {
        const lookupRes = await fetch(`${API_URL}/groups/code/${code}`);
        const lookupData = await lookupRes.json();
        if (!lookupRes.ok) { errorEl.textContent = lookupData.error || 'Group not found.'; return; }

        const joinRes = await fetch(`${API_URL}/groups/${lookupData._id}/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, contact })
        });
        const joinData = await joinRes.json();
        if (!joinRes.ok) { errorEl.textContent = joinData.error || 'Could not join the group.'; return; }

        saveMemberToken(lookupData._id, joinData.memberToken);

        document.getElementById('joinCode').value = '';
        document.getElementById('joinName').value = '';
        document.getElementById('joinContact').value = '';
        loadGroups();
      } catch (err) {
        errorEl.textContent = 'Network error: ' + err.message;
      }
    });

    async function leaveGroup(groupId) {
      const memberToken = getMemberToken(groupId);
      if (!memberToken) {
        alert('No membership found for this ride in this browser.');
        return;
      }
      if (!confirm('Leave this ride group?')) return;

      try {
        const res = await fetch(`${API_URL}/groups/${groupId}/members/me`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ memberToken })
        });
        const data = await res.json();
        if (!res.ok) { alert(data.error || 'Could not leave the group.'); return; }
        removeMemberToken(groupId);
        loadGroups();
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    }

    async function cancelGroup(groupId) {
      const memberToken = getMemberToken(groupId);
      if (!memberToken) {
        alert('No host membership found for this ride in this browser.');
        return;
      }
      if (!confirm('This cancels the ride for the entire group. Continue?')) return;

      try {
        const res = await fetch(`${API_URL}/groups/${groupId}/cancel`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ memberToken })
        });
        const data = await res.json();
        if (!res.ok) { alert(data.error || 'Could not cancel the ride.'); return; }
        removeMemberToken(groupId);
        loadGroups();
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    }

    loadGroups();
  </script>
</body>
</html>
