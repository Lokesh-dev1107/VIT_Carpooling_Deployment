events {
    worker_connections 1024;
}

http {
    # Define the upstream cluster of 3 backend replicas
    upstream vit_carpool_cluster {
        # Round-Robin load distribution algorithm (default)
        server app-1:5001 max_fails=2 fail_timeout=5s;
        server app-2:5001 max_fails=2 fail_timeout=5s;
        server app-3:5001 max_fails=2 fail_timeout=5s;
    }

    server {
        # Nginx listens on port 80 inside the container (mapped to host 8080)
        listen 80;

        location / {
            proxy_pass http://vit_carpool_cluster;
            proxy_http_version 1.1;

            # Forward client and host headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade support (for Socket.io live carpool notifications)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # QUESTION 1c CRITICAL CONFIGURATION: Zero-Downtime Failover
            # If an upstream container dies, immediately retry on the next replica
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            # Pass the X-Handled-By custom header from the backend to the client
            proxy_pass_header X-Handled-By;
        }
    }
}
