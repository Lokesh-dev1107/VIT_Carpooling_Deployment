events {
    worker_connections 1024;
}

http {
    # 1. Baseline: Single instance upstream (for Question 1b benchmark comparison)
    upstream single_instance {
        server app-1:5001;
    }

    # 2. Scaled: 3-instance cluster with Round-Robin (Question 1a, 1b, 1c)
    upstream vit_carpool_cluster {
        server app-1:5001 max_fails=2 fail_timeout=5s;
        server app-2:5001 max_fails=2 fail_timeout=5s;
        server app-3:5001 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;

        # Route for Single Instance baseline testing
        location /single/ {
            proxy_pass http://single_instance/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_pass_header X-Handled-By;
        }

        # Route for 3-Instance Load Balanced Cluster
        location / {
            proxy_pass http://vit_carpool_cluster;
            proxy_http_version 1.1;

            # Forward client headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Question 1c: Zero-Downtime Failover & Fast Re-routing
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_send_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 5s;

            proxy_pass_header X-Handled-By;
        }
    }
}
